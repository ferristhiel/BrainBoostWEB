<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lernplaner – BrainBoost</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f8fafc;
      margin: 0; 
      color: #333;
    }
    header {
      background: #2563eb;
      padding: 15px 20px;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .logo {
      font-weight: 700;
      font-size: 1.6rem;
    }
    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-weight: 600;
    }
    nav a:hover {
      text-decoration: underline;
    }
    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px 50px 20px;
    }
    h1 {
      margin-bottom: 20px;
      color: #0f172a;
      text-align: center;
    }

    /* Formular */
    form {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.1);
      margin-bottom: 30px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    form input, form textarea {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 10px;
      font-size: 14px;
      flex: 1 1 180px;
      min-width: 150px;
      font-family: 'Segoe UI', sans-serif;
    }
    form textarea {
      resize: vertical;
      min-height: 40px;
    }
    form button {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 25px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.3s ease;
      flex: 1 1 100px;
      min-width: 100px;
    }
    form button:hover {
      background: #1e40af;
    }

    /* Aufgabenliste */
    ul.task-list {
      list-style: none;
      padding: 0;
    }
    li.task {
      background: white;
      margin-bottom: 15px;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      position: relative;
      user-select: none;
      overflow: hidden;
      touch-action: pan-y;
    }
    li.task .content {
      pointer-events: none; /* damit Swipe nicht blockiert */
    }
    li.task h3 {
      margin: 0 0 8px 0;
      color: #2563eb;
    }
    li.task p {
      margin: 0 0 6px 0;
      color: #555;
      font-size: 14px;
    }
    li.task small {
      color: #999;
      font-size: 12px;
    }

    /* Swipe delete */
    .delete-btn {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 60px;
      background: #dc2626;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      border-top-right-radius: 12px;
      border-bottom-right-radius: 12px;
      transform: translateX(100%);
      transition: transform 0.3s ease;
    }
    li.task.show-delete .delete-btn {
      transform: translateX(0);
    }

    /* Animation wenn gelöscht */
    li.task.removing {
      animation: slideOutLeft 0.4s forwards;
    }
    @keyframes slideOutLeft {
      to { 
        opacity: 0;
        transform: translateX(-100%);
        height: 0;
        margin-bottom: 0;
        padding-top: 0;
        padding-bottom: 0;
      }
    }

  </style>
</head>
<body>

<header>
  <div class="logo">BrainBoost</div>
  <nav>
    <a href="index.html">Startseite</a>
    <a href="lernplaner.html" style="text-decoration: underline;">Lernplaner</a>
    <a href="bewerbungen.html">Bewerbungen</a>
    <a href="termine.html">Termine</a>
    <a href="tools.html">Tools</a>
  </nav>
</header>

<main>
  <h1>Dein Lernplaner</h1>

  <form id="taskForm" autocomplete="off">
    <input type="text" id="fach" placeholder="Fach (z.B. Mathe)" required />
    <input type="text" id="aufgabe" placeholder="Aufgabe (z.B. Integralrechnung)" required />
    <textarea id="notiz" placeholder="Notiz (Details, Tipps)"></textarea>
    <input type="date" id="deadline" required />
    <button type="submit">Hinzufügen</button>
  </form>

  <ul class="task-list" id="taskList">
    <!-- Aufgaben kommen hier rein -->
  </ul>
</main>

<script>
  const form = document.getElementById('taskForm');
  const taskList = document.getElementById('taskList');

  // Hol alle Aufgaben aus localStorage
  let tasks = JSON.parse(localStorage.getItem('tasks')) || [];

  function saveTasks() {
    localStorage.setItem('tasks', JSON.stringify(tasks));
  }

  function renderTasks() {
    taskList.innerHTML = '';
    tasks.forEach((task, index) => {
      const li = document.createElement('li');
      li.className = 'task';
      li.dataset.index = index;

      li.innerHTML = `
        <div class="content">
          <h3>${task.fach}: ${task.aufgabe}</h3>
          <p>${task.notiz || ''}</p>
          <small>Deadline: ${task.deadline}</small>
        </div>
        <div class="delete-btn">🗑️</div>
      `;

      // Swipe Funktion (mobil + Desktop)
      let startX = 0;
      let currentX = 0;
      let touching = false;

      const deleteBtn = li.querySelector('.delete-btn');
      const content = li.querySelector('.content');

      function setTranslateX(x) {
        content.style.transform = `translateX(${x}px)`;
        if (x < -50) {
          li.classList.add('show-delete');
        } else {
          li.classList.remove('show-delete');
        }
      }

      li.addEventListener('touchstart', (e) => {
        startX = e.touches[0].clientX;
        touching = true;
        li.style.transition = '';
      });

      li.addEventListener('touchmove', (e) => {
        if (!touching) return;
        currentX = e.touches[0].clientX;
        let diff = currentX - startX;
        if (diff < 0) { // nur links swipen
          e.preventDefault();
          setTranslateX(diff);
        }
      }, { passive: false });

      li.addEventListener('touchend', () => {
        touching = false;
        if (content.style.transform !== '') {
          const moved = parseInt(content.style.transform.match(/-?\d+/)[0]);
          if (moved < -100) {
            li.classList.add('show-delete');
            setTranslateX(-60);
          } else {
            li.classList.remove('show-delete');
            setTranslateX(0);
          }
          li.style.transition = 'transform 0.3s ease';
          content.style.transform = li.classList.contains('show-delete') ? 'translateX(-60px)' : 'translateX(0)';
        }
      });

      // Für Desktop (Drag mit Maus)
      let mouseDown = false;
      let mouseStartX = 0;
      li.addEventListener('mousedown', (e) => {
        mouseDown = true;
        mouseStartX = e.clientX;
        li.style.transition = '';
      });
      window.addEventListener('mouseup', (e) => {
        if (!mouseDown) return;
        mouseDown = false;
        const moved = currentX - mouseStartX;
        if (moved < -100) {
          li.classList.add('show-delete');
          setTranslateX(-60);
        } else {
          li.classList.remove('show-delete');
          setTranslateX(0);
        }
        li.style.transition = 'transform 0.3s ease';
        content.style.transform = li.classList.contains('show-delete') ? 'translateX(-60px)' : 'translateX(0)';
      });
      li.addEventListener('mousemove', (e) => {
        if (!mouseDown) return;
        currentX = e.clientX;
        let diff = currentX - mouseStartX;
        if (diff < 0) {
          e.preventDefault();
          setTranslateX(diff);
        }
      });

      // Löschen Button
      deleteBtn.addEventListener('click', () => {
        li.classList.add('removing');
        setTimeout(() => {
          tasks.splice(index, 1);
          saveTasks();
          renderTasks();
        }, 400);
      });

      taskList.appendChild(li);
    });
  }

  form.addEventListener('submit', e => {
    e.preventDefault();
    const fach = document.getElementById('fach').value.trim();
    const aufgabe = document.getElementById('aufgabe').value.trim();
    const notiz = document.getElementById('notiz').value.trim();
    const deadline = document.getElementById('deadline').value;

    if (!fach || !aufgabe || !deadline) {
      alert('Bitte Fach, Aufgabe und Deadline ausfüllen!');
      return;
    }

    tasks.push({ fach, aufgabe, notiz, deadline });
    saveTasks();
    renderTasks();

    form.reset();
  });

  // Beim Laden rendern
  renderTasks();
</script>

</body>
</html>
