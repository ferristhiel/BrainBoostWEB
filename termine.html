<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BrainBoost – Termine</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f8fafc;
      margin: 0;
      color: #333;
    }
    header {
      background: #2563eb;
      padding: 15px 20px;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .logo {
      font-weight: 700;
      font-size: 1.6rem;
    }
    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-weight: 600;
    }
    nav a:hover {
      text-decoration: underline;
    }
    main {
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px 50px 20px;
    }
    h1 {
      margin-bottom: 20px;
      color: #0f172a;
      text-align: center;
    }
    form {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.1);
      margin-bottom: 30px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    form input {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 10px;
      font-size: 14px;
      flex: 1 1 200px;
      min-width: 150px;
      font-family: 'Segoe UI', sans-serif;
    }
    form button {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 25px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.3s ease;
      flex: 1 1 100px;
      min-width: 100px;
    }
    form button:hover {
      background: #1e40af;
    }
    ul.termin-list {
      list-style: none;
      padding: 0;
    }
    li.termin {
      background: white;
      margin-bottom: 15px;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Segoe UI', sans-serif;
    }
    li.termin div.info {
      max-width: 80%;
    }
    li.termin h3 {
      margin: 0 0 6px 0;
      color: #2563eb;
      font-size: 18px;
    }
    li.termin p {
      margin: 0;
      color: #555;
      font-size: 14px;
    }
    button.delete-btn {
      background: #dc2626;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      padding: 8px 14px;
      transition: background 0.3s ease;
    }
    button.delete-btn:hover {
      background: #a81c1c;
    }
    footer {
      background: white;
      padding: 15px;
      text-align: center;
      font-size: 0.9em;
      color: #64748b;
      max-width: 700px;
      margin: 50px auto 20px;
      border-radius: 0 0 12px 12px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

<header>
  <div class="logo">BrainBoost</div>
  <nav>
    <a href="index.html">Startseite</a>
    <a href="lernplaner.html">Lernplaner</a>
    <a href="bewerbungen.html">Bewerbungen</a>
    <a href="termine.html" style="text-decoration: underline;">Termine</a>
    <a href="tools.html">Tools</a>
  </nav>
</header>

<main>
  <h1>Deine Termine</h1>

  <form id="terminForm" autocomplete="off">
    <input type="text" id="titel" placeholder="Titel (z.B. Arzttermin)" required />
    <input type="date" id="datum" required />
    <button type="submit">Hinzufügen</button>
  </form>

  <ul class="termin-list" id="terminList"></ul>
</main>

<footer>
  © 2025 BrainBoost – <a href="#">Datenschutz</a> – <a href="#">Impressum</a>
</footer>

<script>
  const form = document.getElementById('terminForm');
  const terminList = document.getElementById('terminList');

  let termine = JSON.parse(localStorage.getItem('termine')) || [];

  function saveTermine() {
    localStorage.setItem('termine', JSON.stringify(termine));
  }

  function renderTermine() {
    terminList.innerHTML = '';
    termine.forEach((t, i) => {
      const li = document.createElement('li');
      li.className = 'termin';

      li.innerHTML = `
        <div class="info">
          <h3>${t.titel}</h3>
          <p>Datum: ${t.datum}</p>
        </div>
        <button class="delete-btn" data-index="${i}">Löschen</button>
      `;

      terminList.appendChild(li);
    });

    document.querySelectorAll('.delete-btn').forEach(btn => {
      btn.onclick = (e) => {
        const idx = e.target.dataset.index;
        termine.splice(idx, 1);
        saveTermine();
        renderTermine();
      };
    });
  }

  form.addEventListener('submit', e => {
    e.preventDefault();
    const titel = document.getElementById('titel').value.trim();
    const datum = document.getElementById('datum').value;
    if (!titel || !datum) {
      alert('Bitte Titel und Datum ausfüllen!');
      return;
    }
    termine.push({ titel, datum });
    saveTermine();
    renderTermine();
    form.reset();
  });

  renderTermine();
</script>

</body>
</html>
