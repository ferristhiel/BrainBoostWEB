<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BrainBoost – Bewerbungen</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f8fafc;
      margin: 0;
      color: #333;
    }
    header {
      background: #2563eb;
      padding: 15px 20px;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .logo {
      font-weight: 700;
      font-size: 1.6rem;
    }
    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-weight: 600;
    }
    nav a:hover {
      text-decoration: underline;
    }
    main {
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px 50px 20px;
    }
    h1 {
      margin-bottom: 20px;
      color: #0f172a;
      text-align: center;
    }
    form {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.1);
      margin-bottom: 30px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    form input, form select, form textarea {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 10px;
      font-size: 14px;
      font-family: 'Segoe UI', sans-serif;
      min-width: 180px;
      flex: 1 1 220px;
    }
    form textarea {
      resize: vertical;
      min-height: 40px;
    }
    form select {
      max-width: 220px;
    }
    form button {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 25px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.3s ease;
      min-width: 120px;
      flex: 1 1 120px;
      align-self: center;
    }
    form button:hover {
      background: #1e40af;
    }
    ul.app-list {
      list-style: none;
      padding: 0;
    }
    li.app {
      background: white;
      margin-bottom: 15px;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    li.app .info {
      flex: 1 1 60%;
      min-width: 220px;
    }
    li.app h3 {
      margin: 0 0 6px 0;
      color: #2563eb;
      font-size: 18px;
    }
    li.app p {
      margin: 2px 0;
      color: #555;
      font-size: 14px;
    }
    li.app small {
      font-size: 12px;
      color: #888;
    }
    button.delete-btn {
      background: #dc2626;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      padding: 10px 18px;
      transition: background 0.3s ease;
      flex: 0 0 auto;
      height: 44px;
    }
    button.delete-btn:hover {
      background: #a81c1c;
    }
    footer {
      background: white;
      padding: 15px;
      text-align: center;
      font-size: 0.9em;
      color: #64748b;
      max-width: 800px;
      margin: 50px auto 20px;
      border-radius: 0 0 12px 12px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

<header>
  <div class="logo">BrainBoost</div>
  <nav>
    <a href="index.html">Startseite</a>
    <a href="lernplaner.html">Lernplaner</a>
    <a href="bewerbung.html" style="text-decoration: underline;">Bewerbungen</a>
    <a href="termine.html">Termine</a>
    <a href="tools.html">Tools</a>
  </nav>
</header>

<main>
  <h1>Bewerbungen & Praktika</h1>

  <form id="appForm" autocomplete="off">
    <input type="text" id="firma" placeholder="Firma / Stelle" required />
    <select id="status" required>
      <option value="">Status wählen</option>
      <option value="offen">Offen</option>
      <option value="bewerbung">Bewerbung verschickt</option>
      <option value="einladung">Einladung</option>
      <option value="absage">Absage</option>
    </select>
    <textarea id="notiz" placeholder="Notizen (z.B. Gesprächsdatum, Infos)"></textarea>
    <button type="submit">Hinzufügen</button>
  </form>

  <ul class="app-list" id="appList"></ul>
</main>

<footer>
  © 2025 BrainBoost – <a href="#">Datenschutz</a> – <a href="#">Impressum</a>
</footer>

<script>
  const appForm = document.getElementById('appForm');
  const appList = document.getElementById('appList');

  let apps = JSON.parse(localStorage.getItem('apps')) || [];

  function saveApps() {
    localStorage.setItem('apps', JSON.stringify(apps));
  }

  function renderApps() {
    // Sortieren nach Status-Reihenfolge
    const statusOrder = { offen: 1, bewerbung: 2, einladung: 3, absage: 4 };
    apps.sort((a,b) => statusOrder[a.status] - statusOrder[b.status]);

    appList.innerHTML = '';
    apps.forEach((app, i) => {
      const li = document.createElement('li');
      li.className = 'app';

      li.innerHTML = `
        <div class="info">
          <h3>${app.firma}</h3>
          <p>Status: <strong>${app.status.charAt(0).toUpperCase() + app.status.slice(1)}</strong></p>
          <p>${app.notiz || ''}</p>
        </div>
        <button class="delete-btn" data-index="${i}">Löschen</button>
      `;

      appList.appendChild(li);
    });

    document.querySelectorAll('.delete-btn').forEach(btn => {
      btn.onclick = (e) => {
        const idx = e.target.dataset.index;
        apps.splice(idx, 1);
        saveApps();
        renderApps();
      };
    });
  }

  appForm.addEventListener('submit', e => {
    e.preventDefault();
    const firma = document.getElementById('firma').value.trim();
    const status = document.getElementById('status').value;
    const notiz = document.getElementById('notiz').value.trim();

    if (!firma || !status) {
      alert('Bitte Firma/Stelle und Status angeben!');
      return;
    }
    apps.push({ firma, status, notiz });
    saveApps();
    renderApps();
    appForm.reset();
  });

  renderApps();
</script>

</body>
</html>
